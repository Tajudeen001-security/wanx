<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WanX Language{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-inner">
            <a href="/" class="logo">
                <span class="logo-mark">W</span>
                <span class="logo-text">WanX</span>
            </a>
            <div class="nav-links">
                <a href="/" class="{% if request.path == '/' %}active{% endif %}">Home</a>
                <a href="/docs" class="{% if request.path == '/docs' %}active{% endif %}">Learn</a>
                <a href="/playground" class="{% if request.path == '/playground' %}active{% endif %}">Playground</a>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>WanX Programming Language · Created by <strong>JagX</strong> & <strong>JRILICENSE</strong></p>
        <p class="footer-sub">Original vocabulary · Powerful · Built for systems, apps, games & AI</p>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
