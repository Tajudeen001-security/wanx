 {% extends "base.html" %}
{% block title %}WanX Playground{% endblock %}

{% block content %}
<div class="playground">
    <div class="panel">
        <div class="panel-header">
            <h3>Code Editor</h3>
            <div class="panel-actions">
                <button class="btn btn-run" id="runBtn">▶ Run</button>
                <button class="btn btn-secondary" id="saveBtn">Save</button>
                <button class="btn btn-secondary" id="clearBtn">Clear</button>
            </div>
        </div>
        <div class="example-bar" id="exampleBar"></div>
        <div class="editor-area">
            <textarea id="codeEditor" spellcheck="false">:: Welcome to the WanX Playground
:: Write code below and click Run

pulse "Hello from WanX!"

forge name = "Creator"
pulse "Welcome, " + name

forge a = 10
forge b = 3
pulse "Sum: " + str(a + b)</textarea>
        </div>
    </div>

    <div class="panel">
        <div class="panel-header">
            <h3>Output</h3>
            <span class="status" id="status">Ready</span>
        </div>
        <div class="output-area" id="output">Click <strong>Run</strong> to execute your WanX code.</div>

        <div style="padding: 0.8rem 1rem; border-top: 1px solid var(--border);">
            <h4 style="font-size: 0.9rem; margin-bottom: 0.5rem;">Saved Snippets</h4>
            <div id="snippetList" style="font-size: 0.85rem; color: var(--text-muted);">
                Loading...
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/playground.js"></script>
{% endblock %}
